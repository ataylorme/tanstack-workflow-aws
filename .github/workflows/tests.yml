name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Download DynamoDB Local
        run: |
          mkdir -p "$RUNNER_TEMP/dynamodb-local"
          curl --fail --location --retry 3 https://s3.us-west-2.amazonaws.com/dynamodb-local/dynamodb_local_latest.tar.gz -o "$RUNNER_TEMP/dynamodb-local.tar.gz"
          tar -xzf "$RUNNER_TEMP/dynamodb-local.tar.gz" -C "$RUNNER_TEMP/dynamodb-local"
      - name: Run all tests with DynamoDB Local
        run: npm run test:integration
        env:
          DYNAMODB_LOCAL_JAR: ${{ runner.temp }}/dynamodb-local/DynamoDBLocal.jar
      - name: Verify installed package
        run: npm run test:package
      - name: Bundle Lambda examples
        run: npx --no-install esbuild examples/handler.ts examples/sweeper.ts examples/event-bridge-handler.ts examples/event-consumer.ts --bundle --platform=node --target=node22 --format=cjs --outdir=build/ci
      - uses: actions/setup-python@v5
        if: matrix.node == 22
        with:
          python-version: '3.12'
      - name: Validate CloudFormation
        if: matrix.node == 22
        run: |
          python -m pip install 'cfn-lint>=1,<2'
          cfn-lint cloudformation/*.yaml
