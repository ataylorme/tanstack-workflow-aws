AWSTemplateFormatVersion: '2010-09-09'
Description: Optional application-event bridge and failure archive. Use one stream reader per global-table replica.
Parameters:
  StreamArn:
    Type: String
    AllowedPattern: 'arn:aws[a-z-]*:dynamodb:[a-z0-9-]+:[0-9]{12}:table/.+/stream/.+'
    Description: Regional DynamoDB Stream ARN, not the table ARN
  CodeBucket: { Type: String, Description: Regional S3 bucket containing the bundled bridge Lambda ZIP }
  CodeKey: { Type: String, Description: Immutable content-addressed ZIP key containing handler.js }
  BridgeKind:
    Type: String
    AllowedValues: [eventbridge, sns, sqs, webhook]
  Destination:
    Type: String
    Description: Event bus, SNS topic, or SQS queue ARN; for webhook, an HTTPS URL without credentials
    AllowedPattern: '(arn:aws[a-z-]*:(events|sns|sqs):[a-z0-9-]+:[0-9]{12}:.+|https://[^\s]+)'
  EventSource: { Type: String, Default: my.application }
  QueueUrl: { Type: String, Default: '', Description: Required only for the SQS bridge; standard queue in this Region }
Rules:
  SqsDestination:
    RuleCondition: !Equals [!Ref BridgeKind, sqs]
    Assertions:
      - Assert: !Not [!Equals [!Ref QueueUrl, '']]
        AssertDescription: SQS requires its queue URL as well as the ARN in Destination.
Conditions:
  UseEventBridge: !Equals [!Ref BridgeKind, eventbridge]
  UseSns: !Equals [!Ref BridgeKind, sns]
  UseSqs: !Equals [!Ref BridgeKind, sqs]
  UseWebhook: !Equals [!Ref BridgeKind, webhook]
Resources:
  FailureArchive:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTestFailures
            Status: Enabled
            ExpirationInDays: 30
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { RetentionInDays: 14 }
  BridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StreamAndDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
                Resource: !Ref StreamArn
              - Effect: Allow
                Action: [s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt FailureArchive.Arn, !Sub '${FailureArchive.Arn}/*']
                Condition:
                  StringEquals: { 's3:ResourceAccount': !Ref 'AWS::AccountId' }
              - !If
                - UseEventBridge
                - { Effect: Allow, Action: events:PutEvents, Resource: !Ref Destination }
                - !Ref AWS::NoValue
              - !If
                - UseSns
                - { Effect: Allow, Action: sns:Publish, Resource: !Ref Destination }
                - !Ref AWS::NoValue
              - !If
                - UseSqs
                - { Effect: Allow, Action: sqs:SendMessage, Resource: !Ref Destination }
                - !Ref AWS::NoValue
  BridgeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: handler.handler
      Role: !GetAtt BridgeRole.Arn
      Timeout: 30
      MemorySize: 256
      LoggingConfig: { LogGroup: !Ref LogGroup }
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          BRIDGE_KIND: !Ref BridgeKind
          EVENT_BUS_NAME: !If [UseEventBridge, !Ref Destination, '']
          EVENT_SOURCE: !Ref EventSource
          TOPIC_ARN: !If [UseSns, !Ref Destination, '']
          QUEUE_URL: !If [UseSqs, !Ref QueueUrl, '']
          WEBHOOK_URL: !If [UseWebhook, !Ref Destination, '']
  StreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref StreamArn
      FunctionName: !Ref BridgeFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 5
      MaximumRecordAgeInSeconds: 3600
      DestinationConfig:
        OnFailure: { Destination: !GetAtt FailureArchive.Arn }
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"entityType":{"S":["APPLICATION_EVENT"]}}}}'
  DeliveryFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"application_event_delivery_failed"'
      MetricTransformations:
        - MetricNamespace: ApplicationEventBridges
          MetricName: !Sub '${AWS::StackName}-DeliveryFailures'
          MetricValue: '1'
          DefaultValue: 0
  DeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Stream record failures including partial batch failures; inspect retained logs and S3 archive
      Namespace: ApplicationEventBridges
      MetricName: !Sub '${AWS::StackName}-DeliveryFailures'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  IteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions: [{ Name: FunctionName, Value: !Ref BridgeFunction }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  RuntimeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref BridgeFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ArchiveFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: DestinationDeliveryFailures
      Dimensions: [{ Name: FunctionName, Value: !Ref BridgeFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  FunctionArn: { Value: !GetAtt BridgeFunction.Arn }
  StreamMappingId: { Value: !Ref StreamMapping }
  FailureBucketName: { Value: !Ref FailureArchive }
  LogGroupName: { Value: !Ref LogGroup }
